<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Allievi - Scuola di Danza</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdfaf6;
            color: #3a2e3a;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #d98fb3;
            padding: 20px 40px;
        }
        nav .logo {
            font-size: 22px;
            font-weight: bold;
            color: white;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }
        h1 {
            text-align: center;
            color: #7b3f61;
            margin-top: 40px;
        }
        .allievi-list {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .allievo-card {
            background-color: #fbe4ef;
            border-radius: 12px;
            padding: 18px 25px;
            margin-bottom: 15px;
        }
        .allievo-card h3 {
            margin: 0 0 6px 0;
            color: #7b3f61;
        }
        .allievo-card p {
            margin: 2px 0;
            color: #5a4a5a;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Scuola di Danza</div>
        <div>
            <a href="/">Home</a>
            <a href="/corsi/">Corsi</a>
            <a href="/allievi/">Allievi</a>
        </div>
    </nav>

    <h1>I nostri Allievi</h1>
    <div class="allievi-list">
        {% for allievo in allievi %}
        <div class="allievo-card">
            <h3>{{ allievo.utente }}</h3>
            <p>Livello: {{ allievo.livello_danza }}</p>
            <p>Iscritto/a dal: {{ allievo.data_iscrizione_scuola }}</p>
        </div>
        {% empty %}
        <p>Nessun allievo registrato.</p>
        {% endfor %}
    </div>
</body>
</html>
