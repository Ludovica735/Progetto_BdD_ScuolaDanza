<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login - Scuola di Danza</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdfaf6;
            color: #3a2e3a;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #d98fb3;
            padding: 20px 40px;
        }
        nav .logo {
            font-size: 22px;
            font-weight: bold;
            color: white;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }
        .login-box {
            background-color: #fbe4ef;
            max-width: 350px;
            margin: 60px auto;
            padding: 30px 35px;
            border-radius: 12px;
        }
        .login-box h1 {
            text-align: center;
            color: #7b3f61;
            font-size: 24px;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #eadde3;
            box-sizing: border-box;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background-color: #d98fb3;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-box button:hover {
            background-color: #c3729a;
        }
        .errore {
            color: #b23a48;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Scuola di Danza</div>
        <div>
            <a href="/">Home</a>
            <a href="/corsi/">Corsi</a>
            <a href="/allievi/">Allievi</a>
            <a href="/team/">Team</a>
        </div>
    </nav>

    <div class="login-box">
        <h1>Accedi</h1>
        {% if errore %}
            <p class="errore">{{ errore }}</p>
        {% endif %}
        <form method="POST">
            {% csrf_token %} 
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Accedi</button>
        </form>
    </div>
</body>
</html>
